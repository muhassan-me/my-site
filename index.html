<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1228">
  <title></title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='5'%20fill='%23b6ff3a'/%3E%3Cellipse%20cx='32'%20cy='32'%20rx='27'%20ry='12'%20fill='none'%20stroke='%23b6ff3a'%20stroke-width='2'%20transform='rotate(-25%2032%2032)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="js/i18n.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/archive-data.js"></script>
  <script defer src="js/import.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/edition.js"></script>
  <script defer src="js/chrome.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="#/" id="brand-name"></a>
    <span class="spacer"></span>
    <button class="btn ghost" id="language-toggle" type="button"></button>
  </nav>
  <header class="hero">
    <svg class="orbit-motif" viewBox="0 0 520 180" aria-hidden="true">
      <ellipse cx="260" cy="90" rx="245" ry="54" transform="rotate(-16 260 90)" fill="none" stroke="currentColor" stroke-width="1" />
      <ellipse cx="260" cy="90" rx="190" ry="38" transform="rotate(14 260 90)" fill="none" stroke="currentColor" stroke-width="1" />
      <circle cx="425" cy="47" r="3" fill="currentColor" />
    </svg>
    <div class="hero-content">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="subtitle" id="hero-subtitle"></p>
      <div class="global-grid" id="global-stats" aria-live="polite"></div>
    </div>
  </header>
  <main class="container">
    <div class="country-picker">
      <label class="sr-only" for="country-search" id="country-label"></label>
      <div class="combobox">
        <input id="country-search" type="search" autocomplete="off" aria-controls="country-options" aria-expanded="false">
        <div class="list" id="country-options" role="listbox"></div>
      </div>
      <button class="btn ghost hidden" id="back-overview" type="button"></button>
    </div>
    <div class="edition-control">
      <label for="edition-select" id="edition-label"></label>
      <select id="edition-select"></select>
      <span id="edition-status" role="status"></span>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
    <section class="section" id="overview-section">
      <h2 id="overview-title"></h2>
      <div id="leaderboard" class="leaderboard"></div>
      <p class="empty-cell hidden" id="overview-empty"></p>
    </section>
    <section class="section hidden" id="global-events-section">
      <h2 id="global-events-title"></h2>
      <div id="global-events" class="leaderboard"></div>
    </section>
    <section class="section hidden" id="unverified-section">
      <h2 id="unverified-list-title"></h2>
      <div id="unverified-list" class="leaderboard"></div>
    </section>
    <section class="section hidden" id="country-section">
      <div class="country-heading">
        <div><p class="eyebrow" id="country-eyebrow"></p><h2 id="country-title"></h2></div>
        <p class="country-total" id="country-total"></p>
      </div>
      <p class="edition-provenance" id="country-provenance"></p>
      <div class="country-toolbar">
        <label class="sr-only" for="location-search" id="location-search-label"></label>
        <input class="search-input" id="location-search" type="search" autocomplete="off">
        <button class="btn ghost hidden" id="region-toggle" type="button"></button>
      </div>
      <div class="table-wrap">
        <table id="location-table"><thead><tr><th id="th-rank"></th><th id="th-location"></th><th id="th-region"></th><th class="num" id="th-participants"></th><th class="num" id="th-share"></th></tr></thead><tbody></tbody></table>
      </div>
    </section>
    <section class="section" id="archive-chart-section">
      <h2 id="chart-title"></h2>
      <div id="comparison-chart" class="comparison-chart" role="img"></div>
    </section>
  </main>
  <footer class="footer"><span id="footer-copy"></span> <time id="footer-date"></time></footer>
  <button class="drawer-scrim" id="drawer-scrim" type="button"></button>
  <aside class="drawer" id="location-drawer" aria-labelledby="drawer-title" aria-hidden="true">
    <header><h2 id="drawer-title"></h2><button class="btn icon ghost" id="drawer-close" type="button"></button></header>
    <div id="drawer-body"></div>
  </aside>
</body>
</html>
